name: Plugin template CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CORE_COMMIT: ${{ vars.WONDERLAND_CORE_COMMIT || '770461ddc1d54da9ae620892ce8b903adebfe2e7' }}

jobs:
  metadata:
    name: Validate template metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-template.mjs
      - run: node --test tests/*.test.mjs

  core-integration:
    name: Build with Core SDK and UI
    runs-on: windows-latest
    steps:
      - name: Require the verified Core SDK commit
        shell: pwsh
        run: if ($env:CORE_COMMIT -cnotmatch '^[a-f0-9]{40}$') { throw 'Configure WONDERLAND_CORE_COMMIT to the verified package-signing Core commit.' }
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WONDERLAND_CORE_REPOSITORY || 'YueFChen/Wonderland_Assistant' }}
          ref: ${{ env.CORE_COMMIT }}
          path: Wonderland_Assistant
          token: ${{ secrets.WONDERLAND_CORE_CHECKOUT_TOKEN || github.token }}
      - name: Checkout plugin template into Core development layout
        uses: actions/checkout@v4
        with:
          path: Wonderland_Assistant/plugins/wla_template_plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - name: Install Core UI SDK dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Wonderland_Assistant
      - name: Create a fresh plugin repository from the template
        run: pnpm run create:plugin -- --template plugins/wla_template_plugin --id wla_ci_plugin_${{ github.run_id }} --name "CI Plugin" --author "CI"
        working-directory: Wonderland_Assistant
      - name: Build the generated plugin
        run: pnpm --dir plugins/wla_ci_plugin_${{ github.run_id }} run build
        working-directory: Wonderland_Assistant
      - name: Verify the generated plugin's packaged backend
        run: pnpm --dir plugins/wla_ci_plugin_${{ github.run_id }} run test:protocol
        working-directory: Wonderland_Assistant
      - name: Show pinned Rust toolchain
        working-directory: Wonderland_Assistant/plugins/wla_template_plugin
        run: rustup show
      - run: pnpm install --frozen-lockfile
        working-directory: Wonderland_Assistant/plugins/wla_template_plugin
      - run: pnpm run check
        working-directory: Wonderland_Assistant/plugins/wla_template_plugin
      - run: pnpm run package:plugin
        working-directory: Wonderland_Assistant/plugins/wla_template_plugin
      - run: node scripts/test-protocol.mjs target/release-package
        working-directory: Wonderland_Assistant/plugins/wla_template_plugin
